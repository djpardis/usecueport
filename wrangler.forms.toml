name = "cueport-forms"
main = "workers/forms/src/index.ts"
compatibility_date = "2026-06-19"
workers_dev = true
routes = [
  { pattern = "form.usecueport.com", custom_domain = true }
]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ACCESS_FORM_ALLOWED_ORIGINS = "https://usecueport.com,https://www.usecueport.com"
TURNSTILE_EXPECTED_ACTION = "access_request"
TURNSTILE_EXPECTED_HOSTNAMES = "usecueport.com,www.usecueport.com"
